services:
  - type: web
    name: sgu-ecommerce-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run prisma:deploy && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        value: "*"
