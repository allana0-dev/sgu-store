databases:
  - name: sgu-ecommerce-db
    plan: free
    region: oregon
    databaseName: sgu_store
    user: sgu_store_user

services:
  - type: web
    name: sgu-ecommerce-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:deploy && npm run start:prod
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sgu-ecommerce-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        value: "*"
